<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ZeroStack Frontend - AI 交互终端与代码沙盒</title>
  <desc id="hero-desc">基于 Vue 3 与 Risograph 印刷美学的 AI 代码沙盒与 Agent 可视化交互终端</desc>

  <defs>
    <!-- 半调网点纹理 (Halftone Screen) -->
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#17171A" opacity="0.12"/>
    </pattern>
    
    <!-- 标尺细线图案 -->
    <pattern id="ruler-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#17171A" stroke-width="0.5" opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#17171A" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- 主纸张底板 (Warm Paper #FAFAF7) -->
  <rect width="1200" height="440" rx="14" fill="#FAFAF7" stroke="#17171A" stroke-width="2"/>
  
  <!-- 网点与标尺衬底 -->
  <rect x="2" y="2" width="1196" height="436" rx="12" fill="url(#ruler-grid)"/>

  <!-- 印刷对齐基准十字 (Registration Marks) -->
  <g stroke="#17171A" stroke-width="1.2" opacity="0.6">
    <!-- Top-Left -->
    <line x1="20" y1="28" x2="36" y2="28"/>
    <line x1="28" y1="20" x2="28" y2="36"/>
    <circle cx="28" cy="28" r="5" fill="none"/>
    <!-- Top-Right -->
    <line x1="1164" y1="28" x2="1180" y2="28"/>
    <line x1="1172" y1="20" x2="1172" y2="36"/>
    <circle cx="1172" cy="28" r="5" fill="none"/>
    <!-- Bottom-Left -->
    <line x1="20" y1="412" x2="36" y2="412"/>
    <line x1="28" y1="404" x2="28" y2="420"/>
    <circle cx="28" cy="412" r="5" fill="none"/>
    <!-- Bottom-Right -->
    <line x1="1164" y1="412" x2="1180" y2="412"/>
    <line x1="1172" y1="404" x2="1172" y2="420"/>
    <circle cx="1172" cy="412" r="5" fill="none"/>
  </g>

  <!-- 印刷四色色阶标 (Riso Four Drums Gauge) -->
  <g transform="translate(48, 22)">
    <rect x="0" y="0" width="14" height="6" fill="#17171A"/>
    <text x="18" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#17171A" font-weight="600">K:INK</text>

    <rect x="65" y="0" width="14" height="6" fill="#0078BF"/>
    <text x="83" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF" font-weight="600">C:BLUE</text>

    <rect x="135" y="0" width="14" height="6" fill="#FF48B0"/>
    <text x="153" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0" font-weight="600">M:PINK</text>

    <rect x="205" y="0" width="14" height="6" fill="#FFE800" stroke="#17171A" stroke-width="0.5"/>
    <text x="223" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#17171A" font-weight="600">Y:YELLOW</text>

    <text x="300" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B6B72">SCALE: 1:1 · OP_MODE: MULTIPLY · JOB_ID: #ZSTK-2026</text>
  </g>

  <!-- 左侧：品牌信息与价值陈述 -->
  <g transform="translate(48, 64)">
    <!-- 眉标 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="248" height="24" rx="4" fill="#EFEFEA" stroke="#17171A" stroke-width="1"/>
      <!-- 三色微型叠印标 -->
      <g transform="translate(8, 5)">
        <circle cx="5" cy="9" r="4.2" fill="#FFE800" style="mix-blend-mode: multiply;"/>
        <circle cx="3" cy="5" r="4.2" fill="#FF48B0" style="mix-blend-mode: multiply;"/>
        <circle cx="7" cy="5" r="4.2" fill="#0078BF" style="mix-blend-mode: multiply;"/>
      </g>
      <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A" letter-spacing="0.5">ZEROSTACK // FRONTEND</text>
    </g>

    <!-- 主标题 (Display Title) -->
    <text x="0" y="70" font-family="'Archivo', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#17171A" letter-spacing="-1">
      THE CODE PRESS
    </text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#0078BF" letter-spacing="0.2">
      AI 交互终端与代码沙盒工坊
    </text>

    <!-- 核心价值阐述 -->
    <g transform="translate(0, 132)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#17171A" font-weight="500">
        基于 Vue 3 (Composition API) 与孔版印刷美学打造的高保真交互界面。
      </text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#4A4A50">
        原生拦截多段 SSE 流与思考标签，无缝集成 Agent 路由感知、
      </text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#4A4A50">
        Iframe 实时沙盒预览、可视化结对微调与 Nginx 自动化探活部署。
      </text>
    </g>

    <!-- 特性微徽章矩阵 -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="4" fill="#0078BF"/>
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#17171A">Vue 3.5+</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(116, 0)">
        <rect x="0" y="0" width="118" height="28" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="4" fill="#FF48B0"/>
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#17171A">TypeScript</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(242, 0)">
        <rect x="0" y="0" width="104" height="28" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="4" fill="#FFE800" stroke="#17171A" stroke-width="0.8"/>
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#17171A">Vite 8.0</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="134" height="28" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="4" fill="#FF4100"/>
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#17171A">SSE Pipeline</text>
      </g>
    </g>

    <!-- 底部状态指示 -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="488" y2="0" stroke="#17171A" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B6B72">
        TERMINAL: READY · AGENT: STANDBY · DRUM_REGISTER: ALIGNED
      </text>
    </g>
  </g>

  <!-- 右侧：真实机制切片（分栏式沙盒终端工坊） -->
  <g transform="translate(560, 48)">
    <!-- 终端外框阴影层（硬边缘 Riso 投影） -->
    <rect x="6" y="6" width="590" height="344" rx="8" fill="#17171A"/>
    <!-- 终端工作台外壳 -->
    <rect x="0" y="0" width="590" height="344" rx="8" fill="#FFFFFF" stroke="#17171A" stroke-width="2"/>

    <!-- 终端顶部控制栏 (Header) -->
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 582,0 A 8,8 0 0,1 590,8 L 590,36 L 0,36 Z" fill="#EFEFEA" stroke="#17171A" stroke-width="0"/>
    <line x1="0" y1="36" x2="590" y2="36" stroke="#17171A" stroke-width="1.5"/>

    <!-- 三色印刷色标圆点 -->
    <circle cx="20" cy="18" r="5" fill="#FF48B0" stroke="#17171A" stroke-width="0.8"/>
    <circle cx="36" cy="18" r="5" fill="#FFE800" stroke="#17171A" stroke-width="0.8"/>
    <circle cx="52" cy="18" r="5" fill="#0078BF" stroke="#17171A" stroke-width="0.8"/>

    <!-- 终端标题 -->
    <text x="74" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A">
      press-workbench // chat-split-runtime
    </text>

    <!-- 运行状态标 -->
    <g transform="translate(450, 10)">
      <rect x="0" y="0" width="128" height="18" rx="9" fill="#E6F5EA" stroke="#006D00" stroke-width="1"/>
      <circle cx="9" cy="9" r="3.5" fill="#006D00"/>
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#006D00">SANDBOX: ACTIVE</text>
    </g>

    <!-- 中间分栏：左侧 Agent 对话与流程 / 右侧 实时预览沙盒 -->
    <line x1="265" y1="36" x2="265" y2="312" stroke="#17171A" stroke-width="1.2"/>

    <!-- 左栏：Agent SSE 对话 & 思考引擎 (宽度 265) -->
    <g transform="translate(14, 48)">
      <!-- 栏目标题 -->
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6B6B72">STREAMING PIPELINE</text>
      
      <!-- 深度思考标签折叠卡片 (Deep Thinking Panel) -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="237" height="66" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1"/>
        <!-- 标签头 -->
        <rect x="0" y="0" width="237" height="20" rx="4" fill="#E4E4DD"/>
        <path d="M 0,4 A 4,4 0 0,1 4,0 L 233,0 A 4,4 0 0,1 237,4 L 237,20 L 0,20 Z" fill="#E4E4DD"/>
        <line x1="0" y1="20" x2="237" y2="20" stroke="#17171A" stroke-width="1"/>
        <text x="8" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#17171A">&lt;think&gt; 深度思考链 (2.8s)</text>
        <polygon points="220,11 226,11 223,15" fill="#17171A"/>
        
        <!-- 思考内容摘要 -->
        <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A4A50">1. 解析意图: SaaS 企业仪表盘</text>
        <text x="8" y="47" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">2. 决策脚手架: VUE_PROJECT (多文件)</text>
        <text x="8" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A4A50">3. 装配 AntDV 4.x 组件与 Pinia</text>
      </g>

      <!-- Agent 工作流逐级点亮 (Workflow Progress) -->
      <g transform="translate(0, 96)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6B6B72">WORKFLOW PROGRESS</text>
        
        <!-- Step 1 完成 -->
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="237" height="24" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="0.8"/>
          <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#006D00">✓ 智能路由感知</text>
          <text x="175" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">DONE</text>
        </g>
        <!-- Step 2 完成 -->
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="237" height="24" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="0.8"/>
          <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#006D00">✓ 动态代码脚手架生成</text>
          <text x="175" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">14 FILES</text>
        </g>
        <!-- Step 3 运行中 (带粉色闪烁提示) -->
        <g transform="translate(0, 76)">
          <rect x="0" y="0" width="237" height="24" rx="4" fill="#FFE0F1" stroke="#FF48B0" stroke-width="1.2"/>
          <circle cx="12" cy="12" r="3.5" fill="#FF48B0"/>
          <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FF48B0">沙盒热挂载与渲染...</text>
          <text x="195" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FF48B0">RUN</text>
        </g>
        <!-- Step 4 待处理 -->
        <g transform="translate(0, 104)">
          <rect x="0" y="0" width="237" height="24" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="0.6" stroke-dasharray="2 2"/>
          <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B6B72">○ Nginx 自动化探活部署</text>
          <text x="180" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A3A3A8">QUEUED</text>
        </g>
      </g>
    </g>

    <!-- 右栏：实时沙盒预览呈现 (Live Sandbox Iframe) (宽度 310) -->
    <g transform="translate(279, 48)">
      <!-- 预览区标题 & 地址栏 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="297" height="22" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="0.8"/>
        <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B6B72">http://sandbox.local:3000/preview</text>
        <circle cx="282" cy="11" r="3" fill="#006D00"/>
      </g>

      <!-- 沙盒渲染画布 -->
      <g transform="translate(0, 30)">
        <!-- 画布底色 -->
        <rect x="0" y="0" width="297" height="220" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1.2"/>
        
        <!-- 沙盒内应用模拟 UI: 顶部迷你导航 -->
        <rect x="1" y="1" width="295" height="24" fill="#17171A"/>
        <!-- 迷你 Logo -->
        <circle cx="12" cy="12" r="4" fill="#FFE800"/>
        <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">CLOUD METRICS</text>
        <rect x="235" y="6" width="50" height="12" rx="2" fill="#0078BF"/>
        <text x="242" y="15" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFFFFF">LIVE DEMO</text>

        <!-- 沙盒内应用指标卡片 1 -->
        <g transform="translate(10, 34)">
          <rect x="0" y="0" width="132" height="60" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1"/>
          <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B6B72">ACTIVE USERS</text>
          <text x="8" y="38" font-family="'Archivo', sans-serif" font-size="20" font-weight="900" fill="#17171A">28,490</text>
          <text x="8" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#006D00">↑ 14.8% / 24H</text>
        </g>

        <!-- 沙盒内应用指标卡片 2 -->
        <g transform="translate(152, 34)">
          <rect x="0" y="0" width="135" height="60" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1"/>
          <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B6B72">SANDBOX QPS</text>
          <text x="8" y="38" font-family="'Archivo', sans-serif" font-size="20" font-weight="900" fill="#0078BF">1,420</text>
          <text x="8" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#6B6B72">LATENCY: 12ms</text>
        </g>

        <!-- 迷你图表折线展示 -->
        <g transform="translate(10, 104)">
          <rect x="0" y="0" width="277" height="68" rx="4" fill="#FFFFFF" stroke="#17171A" stroke-width="1"/>
          <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#17171A">THROUGHPUT GRAPH (REALTIME)</text>
          
          <!-- 坐标系参考虚线 -->
          <line x1="8" y1="36" x2="269" y2="36" stroke="#E4E4DD" stroke-width="1" stroke-dasharray="2 2"/>
          <line x1="8" y1="52" x2="269" y2="52" stroke="#E4E4DD" stroke-width="1" stroke-dasharray="2 2"/>
          
          <!-- 数据折线 (Riso Blue & Pink) -->
          <polyline points="12,50 48,46 84,32 120,38 156,26 192,30 228,22 264,28" 
                    fill="none" stroke="#0078BF" stroke-width="2"/>
          <circle cx="228" cy="22" r="3" fill="#FF48B0" stroke="#17171A" stroke-width="1"/>
        </g>

        <!-- 沙盒内操作按钮条 -->
        <g transform="translate(10, 182)">
          <rect x="0" y="0" width="132" height="26" rx="4" fill="#17171A"/>
          <text x="24" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF">VISUAL EDIT ↗</text>
          
          <rect x="142" y="0" width="135" height="26" rx="4" fill="#FFE800" stroke="#17171A" stroke-width="1"/>
          <text x="166" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#17171A">DOWNLOAD ZIP</text>
        </g>
      </g>
    </g>

    <!-- 底部状态条 (Terminal Footer) -->
    <path d="M 0,312 L 590,312 L 590,336 A 8,8 0 0,1 582,344 L 8,344 A 8,8 0 0,1 0,336 Z" fill="#17171A"/>
    <text x="16" y="330" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A3A3A8">
      HOT_RELOAD: ON · IFRAME_ISOLATION: SECURE · HEARTBEAT_PROBE: ACTIVE (120ms)
    </text>
    <rect x="525" y="321" width="50" height="14" rx="2" fill="#006D00"/>
    <text x="532" y="331" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFFFFF">SYNC OK</text>
  </g>
</svg>
