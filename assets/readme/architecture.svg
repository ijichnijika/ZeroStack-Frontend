<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ZeroStack Frontend 系统架构全景</title>
  <desc id="arch-desc">展示表示层、核心状态管线、沙盒执行引擎与工程基础设施的四层架构图</desc>

  <defs>
    <pattern id="arch-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#17171A" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- 主底板 -->
  <rect width="1200" height="320" rx="12" fill="#FAFAF7" stroke="#17171A" stroke-width="1.8"/>
  <rect x="2" y="2" width="1196" height="316" rx="10" fill="url(#arch-grid)"/>

  <!-- 头部标识 -->
  <g transform="translate(36, 24)">
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF48B0" letter-spacing="1">
      // SYSTEM ARCHITECTURE
    </text>
    <text x="210" y="12" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#17171A">
      前端分层架构与核心能力解耦 (Layered Engineering Specification)
    </text>
    <line x1="0" y1="22" x2="1128" y2="22" stroke="#17171A" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  </g>

  <!-- 四大横向/纵向分层卡片 (X: 36, 宽度 1128) -->
  
  <!-- Layer 1: Presentation & Riso Design -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="1128" height="52" rx="6" fill="#FFFFFF" stroke="#17171A" stroke-width="1.4"/>
    <rect x="0" y="0" width="160" height="52" rx="6" fill="#17171A"/>
    <path d="M 0,6 A 6,6 0 0,1 6,0 L 160,0 L 160,52 L 6,52 A 6,6 0 0,1 0,46 Z" fill="#17171A"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFE800">LAYER 01</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">表现层与视觉体系</text>

    <!-- 模块标签 -->
    <g transform="translate(180, 12)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="220" height="28" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A">Ant Design Vue 4.x</text>
      <text x="155" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B6B72">TOKEN</text>
      
      <!-- Item 2 -->
      <rect x="232" y="0" width="240" height="28" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A">Riso 4-Drum Palette</text>
      <text x="150" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">INK/C/M/Y</text>

      <!-- Item 3 -->
      <rect x="484" y="0" width="220" height="28" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A">Halftone &amp; Drifting</text>
      <text x="150" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0">CANVAS</text>

      <!-- Item 4 -->
      <rect x="716" y="0" width="216" height="28" rx="4" fill="#FAFAF7" stroke="#17171A" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#17171A">MarkdownViewer</text>
      <text x="140" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">HIGHLIGHT</text>
    </g>
  </g>

  <!-- Layer 2: Core State & Streaming Pipeline -->
  <g transform="translate(36, 122)">
    <rect x="0" y="0" width="1128" height="52" rx="6" fill="#FFFFFF" stroke="#17171A" stroke-width="1.4"/>
    <path d="M 0,6 A 6,6 0 0,1 6,0 L 160,0 L 160,52 L 6,52 A 6,6 0 0,1 0,46 Z" fill="#0078BF"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">LAYER 02</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">状态管线与流引擎</text>

    <!-- 模块标签 -->
    <g transform="translate(180, 12)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="220" height="28" rx="4" fill="#DCECF7" stroke="#0078BF" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0078BF">SSE EventSource Core</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">STREAM</text>

      <!-- Item 2 -->
      <rect x="232" y="0" width="240" height="28" rx="4" fill="#DCECF7" stroke="#0078BF" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0078BF">&lt;think&gt; Parser &amp; Fold</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">NATIVE</text>

      <!-- Item 3 -->
      <rect x="484" y="0" width="220" height="28" rx="4" fill="#DCECF7" stroke="#0078BF" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0078BF">Pinia 3 Store Center</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">SYNC</text>

      <!-- Item 4 -->
      <rect x="716" y="0" width="216" height="28" rx="4" fill="#DCECF7" stroke="#0078BF" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0078BF">Vue Router 4 Guards</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0078BF">RBAC</text>
    </g>
  </g>

  <!-- Layer 3: Sandbox Runtime & Live Editor -->
  <g transform="translate(36, 184)">
    <rect x="0" y="0" width="1128" height="52" rx="6" fill="#FFFFFF" stroke="#17171A" stroke-width="1.4"/>
    <path d="M 0,6 A 6,6 0 0,1 6,0 L 160,0 L 160,52 L 6,52 A 6,6 0 0,1 0,46 Z" fill="#FF48B0"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">LAYER 03</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">沙盒运行时与可视化</text>

    <!-- 模块标签 -->
    <g transform="translate(180, 12)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="220" height="28" rx="4" fill="#FFE0F1" stroke="#FF48B0" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF48B0">Iframe Sandbox Runner</text>
      <text x="165" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0">ISOLATE</text>

      <!-- Item 2 -->
      <rect x="232" y="0" width="240" height="28" rx="4" fill="#FFE0F1" stroke="#FF48B0" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF48B0">Live Editor Bi-Directional</text>
      <text x="180" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0">MUTATE</text>

      <!-- Item 3 -->
      <rect x="484" y="0" width="220" height="28" rx="4" fill="#FFE0F1" stroke="#FF48B0" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF48B0">Heartbeat Polling Probe</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0">PROBE</text>

      <!-- Item 4 -->
      <rect x="716" y="0" width="216" height="28" rx="4" fill="#FFE0F1" stroke="#FF48B0" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF48B0">JSZip Project Archiver</text>
      <text x="165" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF48B0">EXPORT</text>
    </g>
  </g>

  <!-- Layer 4: Infrastructure & Build Ecosystem -->
  <g transform="translate(36, 246)">
    <rect x="0" y="0" width="1128" height="52" rx="6" fill="#FFFFFF" stroke="#17171A" stroke-width="1.4"/>
    <path d="M 0,6 A 6,6 0 0,1 6,0 L 160,0 L 160,52 L 6,52 A 6,6 0 0,1 0,46 Z" fill="#006D00"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">LAYER 04</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">工程构建与质检基建</text>

    <!-- 模块标签 -->
    <g transform="translate(180, 12)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="220" height="28" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#006D00">Vite 8.0 Fast Bundler</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">HMR</text>

      <!-- Item 2 -->
      <rect x="232" y="0" width="240" height="28" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#006D00">vue-tsc Strict Typing</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">STRICT</text>

      <!-- Item 3 -->
      <rect x="484" y="0" width="220" height="28" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#006D00">Oxlint + ESLint Pipe</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">LINT</text>

      <!-- Item 4 -->
      <rect x="716" y="0" width="216" height="28" rx="4" fill="#E6F5EA" stroke="#006D00" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#006D00">OpenAPI2TS Generator</text>
      <text x="175" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#006D00">CODEGEN</text>
    </g>
  </g>
</svg>
